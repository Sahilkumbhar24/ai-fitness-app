# =============================================================================
# Render Blueprint — AI Fitness Application (Free Tier Optimized)
# =============================================================================
# This blueprint runs:
#   1. PostgreSQL Database (Free Managed DB)
#   2. Keycloak Auth Server (Docker Web Service)
#   3. Backend All-in-One Container (Docker Web Service running Eureka + Gateway + Services)
#   4. Frontend Static Site (100% Free CDN, zero sleep)
#
# This setup stays within Render's 750 free tier web service hours!
# =============================================================================

databases:
  - name: fitness-postgres
    plan: free
    databaseName: fitness_micro_user
    user: fitness_user

services:
  # ─── 1. Keycloak Identity Server ───
  - type: web
    name: fitness-keycloak
    runtime: docker
    plan: free
    dockerfilePath: ./keycloak/Dockerfile
    dockerContext: ./keycloak
    envVars:
      - key: PORT
        value: "8080"
      - key: KEYCLOAK_ADMIN
        value: admin
      - key: KEYCLOAK_ADMIN_PASSWORD
        generateValue: true
      - key: KC_HOSTNAME_STRICT
        value: "false"
      - key: KC_PROXY
        value: edge
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_DB_URL
        value: "jdbc:h2:mem:keycloak;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE"
      - key: JAVA_OPTS_APPEND
        value: "-Xms128m -Xmx240m -XX:MaxMetaspaceSize=128m"

  # ─── 2. Backend All-in-One Container (Gateway + Eureka + Services) ───
  - type: web
    name: fitness-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: GEMINI_API_KEY
        sync: false  # Enter your Gemini API key in Render Dashboard
      - key: SPRING_DATA_MONGODB_URI
        sync: false  # Enter your MongoDB Atlas URI (e.g. mongodb+srv://...)
      - key: SPRING_DATA_MONGODB_DATABASE
        value: aiactivityfitness
      - key: SPRING_KAFKA_BOOTSTRAP_SERVERS
        sync: false  # Enter your Kafka broker (e.g. Aiven)
      - key: SPRING_KAFKA_SECURITY_PROTOCOL
        value: "SASL_SSL"
      - key: SPRING_KAFKA_SASL_MECHANISM
        value: "SCRAM-SHA-256"
      - key: SPRING_KAFKA_SASL_JAAS_CONFIG
        sync: false  # JAAS string with username and password
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: fitness-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: fitness-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: fitness-postgres
          property: password
      - key: KEYCLOAK_JWK_URI
        sync: false  # Set to: https://<keycloak-host>/realms/fitness-app/protocol/openid-connect/certs

  # ─── 3. React Frontend (Free Static Site with CDN & SPA rewrite) ───
  - type: web
    runtime: static
    name: fitness-frontend
    buildCommand: cd "fitness project" && npm install && npm run build
    staticPublishPath: "./fitness project/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://fitness-backend-pqge.onrender.com/api"
      - key: VITE_KEYCLOAK_URL
        value: "https://fitness-keycloak-ho08.onrender.com"
      - key: VITE_KEYCLOAK_REALM
        value: fitness-app
      - key: VITE_KEYCLOAK_CLIENT_ID
        value: oauth2-pkce-client
