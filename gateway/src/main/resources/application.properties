server.port=${PORT:8080}
spring.application.name=api-gateway

# Import config from Config Server if active, otherwise use local defaults
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Fallback routes
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:lb://USER-SERVICE}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[1].id=activity-service
spring.cloud.gateway.routes[1].uri=${ACTIVITY_SERVICE_URL:lb://ACTIVITY-SERVICE}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/activities/**

spring.cloud.gateway.routes[2].id=ai-service
spring.cloud.gateway.routes[2].uri=${AI_SERVICE_URL:lb://AI-SERVICE}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/recommendations/**

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8181/realms/fitness-app/protocol/openid-connect/certs}

